- assertVisible: "Bowling with the presidents"
- assertVisible: "Board games night in Kinepolis"

- tapOn:
    text: "Join activity"
    index: 2

- assertVisible: "Join activity"
- assertVisible: "Study session at KU Leuven Library"
- assertVisible: "Organized by"
- assertVisible: "John Doe's group"
- assertVisible: "These people are going"
- assertVisible: "John Pork"
- assertVisible: "Jane Doe"
- assertVisible: "Timeframe"
