    text: 'Email'
    index: 1
- inputText: barack@obama.com

- tapOn: 
    text: 'Password'
    index: 1
- inputText: TheGoat123

- tapOn: 'Log in'

- swipe:
    start: 50%, 80%
    end: 50%, 20%

- assertVisible: "Eating some CHOCOLATE ice cream"
- assertVisible: "Open-air concert at Ladeuzeplein"
